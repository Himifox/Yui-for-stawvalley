name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - stardew-valley
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release.mjs

      - name: Build release package
        shell: bash
        run: dotnet build YuiToIssho.csproj -c Release -p:EnableModDeploy=false -p:NuGetAudit=false

      - name: Verify release package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release.mjs --artifact

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuiToIssho-${{ github.ref_name }}
          path: bin/Release/net6.0/YuiToIssho *.zip
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="bin/Release/net6.0/YuiToIssho ${version}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
